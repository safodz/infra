name: 'Terraform Lint'

on:
  push:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'

env:
  TF_VERSION: '1.5.0'

jobs:
  lint:
    name: 'Lint Terraform'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        run: |
          find . -name "*.tf" -not -path "./.terraform/*" -exec terraform fmt -check {} \;

      - name: Terraform Validate (Modules)
        run: |
          for dir in modules/*/; do
            echo "Validating $dir"
            cd "$dir"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

      - name: Terraform Validate (Environments)
        run: |
          for dir in environments/*/; do
            echo "Validating $dir"
            cd "$dir"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

      - name: Check for sensitive data
        run: |
          if grep -r "password\|secret\|key" --include="*.tf" --include="*.tfvars" . | grep -v ".git" | grep -v "variable\|output\|description"; then
            echo "⚠️ Warning: Potential sensitive data found in Terraform files"
            exit 1
          fi

